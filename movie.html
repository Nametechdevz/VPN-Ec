<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" id="meta-description" content="Detalles de la película" />
  <title id="page-title">Cargando... | CineMax</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>

  <!-- HEADER -->
  <header class="header" id="header">
    <div class="header__inner">
      <a href="index.html" class="logo" id="logo-link">
        <span class="logo__icon" id="logo-icon">🎬</span>
        <span class="logo__text" id="logo-text">CineMax</span>
      </a>

      <nav class="nav">
        <a href="index.html" class="nav__link">Inicio</a>
        <a href="index.html?category=movie&genre=28" class="nav__link">Acción</a>
        <a href="index.html?category=movie&genre=35" class="nav__link">Comedia</a>
        <a href="index.html?category=movie&genre=27" class="nav__link">Terror</a>
        <a href="index.html?category=tv" class="nav__link">Series</a>
      </nav>

      <div class="search-box">
        <input type="text" id="search-input" class="search-box__input" placeholder="Buscar películas, series..." autocomplete="off" />
        <button class="search-box__btn" id="search-btn" aria-label="Buscar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
          </svg>
        </button>
      </div>

      <button class="hamburger" id="hamburger" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
    </div>

    <div class="mobile-menu" id="mobile-menu">
      <a href="index.html" class="mobile-menu__link">Inicio</a>
      <a href="index.html?category=movie&genre=28" class="mobile-menu__link">Acción</a>
      <a href="index.html?category=movie&genre=35" class="mobile-menu__link">Comedia</a>
      <a href="index.html?category=movie&genre=27" class="mobile-menu__link">Terror</a>
      <a href="index.html?category=tv" class="mobile-menu__link">Series</a>
    </div>
  </header>

  <!-- DETAIL HERO -->
  <section class="detail-hero" id="detail-hero">
    <div class="detail-hero__backdrop" id="detail-backdrop"></div>
    <div class="detail-hero__overlay"></div>
    <div class="detail-hero__content" id="detail-content">
      <!-- skeleton -->
      <div class="detail-skeleton">
        <div class="skeleton skeleton--poster"></div>
        <div class="detail-skeleton__info">
          <div class="skeleton skeleton--title"></div>
          <div class="skeleton skeleton--text"></div>
          <div class="skeleton skeleton--text"></div>
          <div class="skeleton skeleton--text skeleton--short"></div>
          <div class="skeleton skeleton--buttons"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- MAIN DETAIL -->
  <main class="main detail-main" id="detail-main" style="display:none;">

    <!-- CAST -->
    <section class="section">
      <div class="section__header">
        <h2 class="section__title">Reparto Principal</h2>
      </div>
      <div class="slider-wrap">
        <button class="slider-arrow slider-arrow--left" data-slider="cast" aria-label="Anterior">&#8249;</button>
        <div class="slider" id="cast-slider">
          <div class="slider__track" id="cast-track"></div>
        </div>
        <button class="slider-arrow slider-arrow--right" data-slider="cast" aria-label="Siguiente">&#8250;</button>
      </div>
    </section>

    <!-- TRAILER -->
    <section class="section" id="trailer-section" style="display:none;">
      <div class="section__header">
        <h2 class="section__title">Tráiler Oficial</h2>
      </div>
      <div class="trailer-wrap">
        <div class="trailer-container" id="trailer-container"></div>
      </div>
    </section>

    <!-- SIMILAR -->
    <section class="section" id="similar-section">
      <div class="section__header">
        <h2 class="section__title" id="similar-title">Películas Similares</h2>
      </div>
      <div class="slider-wrap">
        <button class="slider-arrow slider-arrow--left" data-slider="similar" aria-label="Anterior">&#8249;</button>
        <div class="slider" id="similar-slider">
          <div class="slider__track" id="similar-track"></div>
        </div>
        <button class="slider-arrow slider-arrow--right" data-slider="similar" aria-label="Siguiente">&#8250;</button>
      </div>
    </section>

  </main>

  <!-- MODAL TRAILER -->
  <div class="modal" id="trailer-modal">
    <div class="modal__overlay" id="modal-overlay"></div>
    <div class="modal__box">
      <button class="modal__close" id="modal-close" aria-label="Cerrar">✕</button>
      <div class="modal__video" id="modal-video"></div>
    </div>
  </div>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="footer__inner">
      <a href="index.html" class="logo">
        <span class="logo__icon" id="footer-logo-icon">🎬</span>
        <span class="logo__text" id="footer-logo-text">CineMax</span>
      </a>
      <p class="footer__copy">
        Datos proporcionados por
        <a href="https://www.themoviedb.org" target="_blank" rel="noopener">TMDb</a>.
        Este sitio no está afiliado con TMDb.
      </p>
      <div class="footer__tmdb">
        <img src="https://www.themoviedb.org/assets/2/v4/logos/v2/blue_short-8e7b30f73a4020692ccca9c88bafe5dcb6f8a62a4c6bc55cd9ba82bb2cd95f6c.svg" alt="TMDb Logo" height="20" />
      </div>
    </div>
  </footer>

  <button class="back-to-top" id="back-to-top" aria-label="Volver arriba">↑</button>

  <script src="config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/movie.js"></script>
</body>
</html>
